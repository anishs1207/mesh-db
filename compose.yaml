name: meshdb

x-node: &node
  build: .
  restart: unless-stopped
  secrets:
    - cluster_secret

services:
  node1:
    <<: *node
    command:
      - -port=7000
      - -advertise=node1:7000
      - -peers=node2:7000,node3:7000
      - -data-dir=/data
      - -cluster-secret-file=/run/secrets/cluster_secret
      - -operations-address=0.0.0.0:9090
    ports: ["7000:7000", "9090:9090"]
    volumes: ["node1-data:/data"]

  node2:
    <<: *node
    command:
      - -port=7000
      - -advertise=node2:7000
      - -peers=node1:7000,node3:7000
      - -data-dir=/data
      - -cluster-secret-file=/run/secrets/cluster_secret
      - -operations-address=0.0.0.0:9090
    ports: ["7001:7000", "9091:9090"]
    volumes: ["node2-data:/data"]

  node3:
    <<: *node
    command:
      - -port=7000
      - -advertise=node3:7000
      - -peers=node1:7000,node2:7000
      - -data-dir=/data
      - -cluster-secret-file=/run/secrets/cluster_secret
      - -operations-address=0.0.0.0:9090
    ports: ["7002:7000", "9092:9090"]
    volumes: ["node3-data:/data"]

volumes:
  node1-data:
  node2-data:
  node3-data:

secrets:
  cluster_secret:
    file: ${MESHDB_CLUSTER_SECRET_FILE:?set MESHDB_CLUSTER_SECRET_FILE}
